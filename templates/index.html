<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quadge - Quadlet Manager</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
	<script src="https://unpkg.com/htmx.org@2.0.0"></script>
	<script src="https://unpkg.com/htmx-ext-sse@2.0.0/sse.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/ini.min.js"></script>
	<style>
		:root {
			--accent: #ffd600;
			--accent-hover: #e6c200;
			--border-thick: 3px solid #000;
			--shadow-offset: 4px;
			--shadow: 4px 4px 0 #000;
			--radius: 0;
			--sidebar-width: 240px;
			--font-body: system-ui, -apple-system, sans-serif;
			--font-mono: 'JetBrains Mono', 'Fira Code', monospace;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			font-family: var(--font-body);
			background: #fefefe;
		}
		.layout {
			display: flex;
			min-height: 100vh;
		}
		.sidebar {
			width: var(--sidebar-width);
			background: var(--accent);
			border-right: var(--border-thick);
			padding: 1rem;
			display: flex;
			flex-direction: column;
		}
		.sidebar h3 {
			margin: 0 0 0.75rem 0;
			font-weight: 900;
			font-size: 1.2rem;
			letter-spacing: 1px;
			text-transform: uppercase;
		}
		.service-list {
			flex: 1;
			overflow-y: auto;
		}
		.service-item {
			padding: 0.4rem 0.5rem;
			cursor: pointer;
			border-radius: 0;
			margin-bottom: 0.25rem;
			font-weight: 700;
			font-size: 0.85rem;
			border: 2px solid transparent;
			color: #000;
		}
		.service-item:hover {
			background: rgba(255,255,255,0.7);
		}
		.service-item.active {
			background: #fff;
			border-color: #000;
		}
		.group-item {
			padding: 0.4rem 0.5rem;
			cursor: pointer;
			font-weight: 800;
			font-size: 0.85rem;
			background: #fff;
			border: 2px solid #000;
			margin-bottom: 0;
			color: #000;
		}
		.group-item:hover {
			background: #fff3a0;
		}
		.group-children {
			margin-left: 0.75rem;
			border-left: 2px solid #000;
		}
		.group-child-item {
			padding: 0.3rem 0.5rem;
			cursor: pointer;
			font-weight: 600;
			font-size: 0.8rem;
			background: #fff;
			margin-bottom: 0;
			border-left: 2px solid #000;
			color: #000;
		}
		.group-child-item:hover {
			background: #f0f0f0;
		}
		.group-child-item.active {
			background: var(--accent);
		}
		.type-badge {
			display: inline-block;
			padding: 0.05rem 0.3rem;
			font-size: 0.6rem;
			font-weight: 700;
			border: 1px solid #000;
			background: rgba(255,255,255,0.7);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-left: 0.3rem;
			vertical-align: middle;
		}
		.type-badge-pod { background: #ffd600; }
		.type-badge-container { background: #4dabf7; }
		.type-badge-volume { background: #a855f7; }
		.type-badge-network { background: #51cf66; }
		.type-badge-kube { background: #ff6b6b; }
		.main {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}
		.main-header {
			padding: 1rem;
			border-bottom: var(--border-thick);
			display: flex;
			align-items: center;
			gap: 1rem;
			background: #fff;
		}
		.main-header h4 {
			font-weight: 900;
			margin: 0;
		}
		.main-content {
			flex: 1;
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1rem;
			padding: 1rem;
			overflow: hidden;
			min-height: 0;
		}
		.panel {
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}
		.panel-header {
			font-weight: 800;
			margin-bottom: 0.5rem;
			text-transform: uppercase;
			letter-spacing: 1px;
			font-size: 0.75rem;
		}
		.panel-content {
			flex: 1;
			overflow-y: auto;
			min-height: 0;
			background: #f0f0f0;
			padding: 0.5rem;
			border: var(--border-thick);
			box-shadow: var(--shadow);
		}
		.status-running { color: #0a0; font-weight: bold; }
		.status-stopped { color: #000; }
		.status-failed { color: #dc3545; font-weight: bold; }
		.status-success { color: #0a0; }
		.status-error { color: #dc3545; }
		.status-degraded { color: #e6c200; font-weight: bold; }
		pre {
			margin: 0;
			white-space: pre-wrap;
			font-size: 0.85rem;
			font-family: var(--font-mono);
		}
		.logs {
			font-family: var(--font-mono);
			font-size: 0.8rem;
			line-height: 1.4;
			background: #1a1a2e;
			padding: 0.75rem;
			color: #ccc;
		}
		.log-line { margin: 0; padding: 0; }
		.log-error { color: #ff6b6b; font-weight: bold; }
		.log-warn { color: #ffa94d; }
		.log-info { color: #4dabf7; }
		.log-debug { color: #868e96; }
		.hljs {
			background: transparent !important;
			padding: 0 !important;
		}
		#main-content {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}
		.btn-group {
			display: flex;
			gap: 0.5rem;
			margin-left: auto;
		}
		.btn-group button {
			padding: 0.3rem 0.75rem;
			font-size: 0.8rem;
			font-weight: 700;
			border: 2px solid #000;
			border-radius: 0;
			cursor: pointer;
			box-shadow: 2px 2px 0 #000;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		.btn-group button:active {
			box-shadow: 0 0 0 #000;
			transform: translate(2px, 2px);
		}
		.btn-group button:hover {
			box-shadow: 3px 3px 0 #000;
			transform: translate(-1px, -1px);
		}
		button.outline {
			background: #000;
			color: #fff;
			border: 2px solid #000;
			padding: 0.4rem 0.75rem;
			font-weight: 700;
			font-size: 0.85rem;
			cursor: pointer;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		button.outline:hover {
			background: #333;
		}
		button.secondary {
			background: #fff;
			color: #000;
		}
		button.contrast {
			background: #ff6b6b;
			color: #000;
			border-color: #000;
		}
		.breadcrumb {
			font-size: 0.75rem;
			color: #666;
			margin-bottom: 0.25rem;
			font-weight: 600;
		}
		.breadcrumb a {
			color: #000;
			text-decoration: none;
			border-bottom: 1px solid #000;
		}
		.breadcrumb a:hover {
			color: var(--accent-hover);
		}
		.tree-icon { margin-right: 0.25rem; }
		.status-dot { margin-left: 0.25rem; }
		.badge {
			display: inline-block;
			padding: 0.1rem 0.4rem;
			font-size: 0.65rem;
			font-weight: 700;
			border: 1px solid #000;
			background: #fff;
			text-transform: uppercase;
		}
		.badge-warning { background: #ffd600; }
		.badge-error { background: #ff6b6b; }
	</style>
</head>
<body>
	<div class="layout">
		<aside class="sidebar">
			<h3>Quadge</h3>
			<button hx-get="/new" hx-target="#main-content" class="outline" style="margin-bottom: 1rem;">+ New Service</button>
			<div class="service-list" id="service-list">
				{{template "service-list" .}}
			</div>
		</aside>
		<main class="main">
			<div id="main-content">
				{{template "main-content" .}}
			</div>
		</main>
	</div>
	<script>
		document.body.addEventListener('htmx:afterSettle', function() {
			document.querySelectorAll('pre code:not(.hljs)').forEach((block) => {
				hljs.highlightElement(block);
			});
		});
		document.body.addEventListener('htmx:sseMessage', function(evt) {
			var el = evt.detail.elt;
			el.scrollTop = el.scrollHeight;
		});
	</script>
</body>
</html>
{{define "main-content"}}
{{if .Service}}
	{{template "service-detail" .}}
{{else}}
<div class="main-content" style="align-items: center; justify-content: center;">
	<p style="color: #888;">Select a service or create a new one</p>
</div>
{{end}}
{{end}}
