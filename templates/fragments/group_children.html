{{define "group-children"}}
{{range .Members}}
<div class="group-child-item {{if eq .Name $.Selected}}active{{end}}"
     hx-get="/service/{{.Name}}"
     hx-target="#main-content"
     hx-swap="innerHTML"
     hx-on::after-request="document.querySelectorAll('.service-item, .group-child-item').forEach(function(el){el.classList.remove('active')});this.classList.add('active');">
    <span>{{.Name}}</span>
    <span class="type-badge type-badge-{{.Type}}">{{.Type}}</span>
    {{if eq .Status "running"}}<span class="status-dot status-running">●</span>
    {{else if eq .Status "failed"}}<span class="status-dot status-failed">●</span>
    {{else}}<span class="status-dot status-stopped">○</span>{{end}}
</div>
{{end}}
{{if not .Members}}
<div class="group-child-item" style="color: #000; cursor: default;">
    <span class="badge badge-warning">no members</span>
</div>
{{end}}
{{end}}
